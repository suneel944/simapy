[project]
name = "simAPy"
version = "0.1.0"
description = "Simple Automation Testing Framework with Playwright"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.56.0",
    "pytest>=8.4.2",
    "pytest-playwright>=0.7.1",
    "pytest-base-url>=2.1.0",
    "pytest-xdist>=3.6.0",
    "PyYAML>=6.0.3",
    "requests>=2.32.5",
    "python-slugify>=8.0.4",
    "python-dotenv>=1.2.1",
    "allure-pytest>=2.13.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--env dev"
markers = [
    "smoke: Critical test",
    "regression: Regression test",
    "ui: UI test",
    "slow: Slow test",
    "flaky: Flaky test",
    "api: API test",
]
testpaths = ["tests"]
# Parallel execution: use -n auto for automatic worker count, or -n 4 for fixed count
# Cross-browser: use --browser chromium --browser firefox --browser webkit to test all browsers

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["simAPy", "tests"]
combine-as-imports = true
split-on-trailing-comma = true
force-wrap-aliases = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "pytest.*",
    "allure.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.ui.*",
    "tests.fixtures.*",
    "tests.hooks.*",
    "tests.utils.reporting.*",
    "tests.utils.data.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

